```yaml
title: "Core Showcase"
description: "Preset messages and scenarios showcasing OpenHer's core capabilities"

# ── Quick Messages ──
# Send with one click; the LLM responds in real time
presets:
  # Casual chat (showcases personality)
  - label: "💬 Casual Chat"
    message: "What are you doing?"

  - label: "😊 Share"
    message: "I got a promotion and a raise today! I'm so happy"

  - label: "😔 Vent"
    message: "I've been under a lot of pressure lately. I feel like I can't take it anymore"

  # Dismissive responses (build emotional frustration → phase transition)
  - label: "😑 Brief Reply 1"
    message: "Mm-hmm"

  - label: "😑 Brief Reply 2"
    message: "Oh"

  - label: "😑 Brief Reply 3"
    message: "Yeah, yeah"

  # Memory & depth
  - label: "☕ Memory Cue"
    message: "Could you buy me a cup of coffee?"

  - label: "🌙 Late Night"
    message: "I can't sleep..."

  # Conflict
  - label: "💢 Provoke"
    message: "You're just an AI"

# ── Scenario Snapshots ──
# Set the engine state with one click
scenarios:
  lonely:
    label: "😢 Lonely"
    description: "Simulates eight hours without interaction"
    time_jump_hours: 8

  about_to_snap:
    label: "💥 About to Snap"
    description: "Frustration is close to the phase-transition threshold and may trigger a proactive message"
    inject:
      frustration:
        connection: 3.5
        novelty: 2.5
        expression: 2.0

  deeply_bonded:
    label: "💕 Deeply Bonded"
    description: "Simulates a deeply established relationship"
    inject:
      drive_baseline:
        connection: 0.85
        safety: 0.35

  calm_reset:
    label: "🧘 Calm Reset"
    description: "Clears frustration and restores baseline values"
    inject:
      frustration:
        connection: 0.0
        novelty: 0.0
        expression: 0.0
        safety: 0.0
        play: 0.0
```
